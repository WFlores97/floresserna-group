# Configuración de despliegue para Netlify (host recomendado).
# El sitio es estático: se publica la carpeta tal cual, sin build.

[build]
  publish = "."
  command = ""

# Cabeceras de seguridad y de caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Caché por tipo de archivo. Ningún nombre lleva hash, así que la duración
# tiene que corresponder a qué tan seguido cambia el contenido.

# Fotografía, logotipos y el mapa: nombre estable, contenido estable.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Boletines en PDF: se agregan más de lo que se corrigen, pero una corrección
# reemplaza el archivo con el mismo nombre. Un día.
[[headers]]
  for = "/assets/boletines/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Estilos y scripts: sin hash en el nombre. Con caché larga, un ajuste de
# diseño no le llegaría nunca a quien ya visitó el sitio.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Que los datos del boletín no se queden cacheados de más
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
